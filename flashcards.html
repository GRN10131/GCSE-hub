<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Flashcards — GCSE Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =========================================
           FLASHCARD WOJTEK
           ========================================= */

        .flashcard-wojtek {

            display: flex;

            justify-content: center;

            margin:
                10px 0 20px;

        }


        .flashcard-wojtek-area {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

        }


        .flashcard-wojtek-image {

            width: 170px;

            height: 170px;

            background-repeat: no-repeat;

            background-position: center;

            background-size: contain;

            transition:
                opacity .15s ease,
                transform .2s ease;

            filter:
                drop-shadow(
                    0 6px 6px
                    rgba(0,0,0,.08)
                );

        }


        /* Small bounce whenever Wojtek changes */

        .flashcard-wojtek-image.change {

            animation:
                wojtekFlashcardChange .45s ease;

        }


        @keyframes wojtekFlashcardChange {

            0% {

                opacity: .55;

                transform:
                    scale(.94);

            }

            50% {

                opacity: 1;

                transform:
                    scale(1.06);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        /* Speech bubble */

        .flashcard-wojtek-message {

            position: relative;

            max-width: 310px;

            padding:
                10px 15px;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                var(--shadow);

            text-align: center;

            font-size: 14px;

            line-height: 1.4;

        }


        .flashcard-wojtek-message::before {

            content: "";

            position: absolute;

            top: -8px;

            left: 50%;

            transform:
                translateX(-50%);

            border-left:
                8px solid transparent;

            border-right:
                8px solid transparent;

            border-bottom:
                8px solid white;

        }


        .flashcard-wojtek-message strong {

            color:
                var(--primary);

        }


        /* Mobile */

        @media(max-width:700px) {

            .flashcard-wojtek-image {

                width: 135px;

                height: 135px;

            }

            .flashcard-wojtek-message {

                max-width: 270px;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>

<div class="app">

    <main class="main">

        <!-- =====================================
             PAGE HEADER
             ===================================== -->

        <div class="hero">

            <div>

                <h1>
                    Flashcards 🗂️
                </h1>

                <p>
                    Specific questions, not just topic names.
                </p>

            </div>

        </div>


        <!-- =====================================
             WOJTEK
             ===================================== -->

        <div class="flashcard-wojtek">

            <div class="flashcard-wojtek-area">

                <div
                    id="flashWojtek"
                    class="flashcard-wojtek-image"
                ></div>


                <div
                    id="flashWojtekMessage"
                    class="flashcard-wojtek-message"
                >
                    <strong>Let's revise!</strong>
                    <br>
                    Think carefully before revealing the answer.
                </div>

            </div>

        </div>


        <!-- =====================================
             FLASHCARD
             ===================================== -->

        <div class="flashcard card">

            <div
                class="subject-chip"
                data-subject
            >
                Subject
            </div>


            <div
                class="muted small"
                id="counter"
            ></div>


            <div
                class="question"
                id="q"
            ></div>


            <div
                class="answer"
                id="a"
            ></div>


            <button
                class="btn"
                id="reveal"
                type="button"
            >
                Reveal answer
            </button>


            <!-- Rating buttons -->

            <div
                class="rating"
                id="rating"
            >

                <button
                    class="btn ghost"
                    id="againBtn"
                    type="button"
                >
                    🔴 Again
                </button>


                <button
                    class="btn gold"
                    id="hardBtn"
                    type="button"
                >
                    🟠 Difficult
                </button>


                <button
                    class="btn success"
                    id="goodBtn"
                    type="button"
                >
                    🟢 Good
                </button>


                <button
                    class="btn"
                    id="easyBtn"
                    type="button"
                >
                    🔵 Easy
                </button>

            </div>

        </div>


        <!-- =====================================
             DASHBOARD BUTTON
             ===================================== -->

        <div
            class="center"
            style="text-align:center"
        >

            <a
                class="btn ghost"
                href="dashboard.html"
            >
                ← Dashboard
            </a>

        </div>

    </main>

</div>


<!-- =========================================
     GCSE HUB APP
     ========================================= -->

<script src="js/app.js"></script>


<script>

/* =========================================
   FLASHCARD DATA
   ========================================= */

const qs = {

    maths: [

        [
            "What is the gradient of a straight line written as y=3x+2?",
            "The gradient is 3."
        ],

        [
            "What is the nth term of 3, 6, 9, 12...?",
            "3n."
        ]

    ],


    history: [

        [
            "What was one major change in medical treatment during the Renaissance?",
            "An increased emphasis on observation and anatomy helped challenge some traditional ideas."
        ]

    ],


    biology: [

        [
            "What is the function of the mitochondria?",
            "They are the site of aerobic respiration and release energy for the cell."
        ]

    ],


    chemistry: [

        [
            "What is oxidation in terms of oxygen?",
            "Oxidation is gain of oxygen."
        ]

    ],


    physics: [

        [
            "What is the equation linking force, mass and acceleration?",
            "F = ma."
        ]

    ],


    english: [

        [
            "What is a key theme in Macbeth?",
            "Ambition is a central theme, explored through Macbeth and Lady Macbeth."
        ]

    ]

};


/* =========================================
   LOAD GCSE HUB DATA
   ========================================= */

let d = load();


/*
    Get the student's selected subject.
*/

let subject =
    d.subject ||
    "biology";


/*
    Get the relevant cards.
*/

let list =
    qs[subject] ||
    [

        [
            "What is an important fact from this subject?",

            "This is a starter card. More specification-aligned cards can be added to the content bank."

        ]

    ];


/* =========================================
   CURRENT CARD
   ========================================= */

let i = 0;


/* =========================================
   ELEMENTS
   ========================================= */

const questionElement =
    document.getElementById("q");

const answerElement =
    document.getElementById("a");

const counterElement =
    document.getElementById("counter");

const revealButton =
    document.getElementById("reveal");

const ratingElement =
    document.getElementById("rating");

const subjectElement =
    document.querySelector("[data-subject]");

const wojtekElement =
    document.getElementById("flashWojtek");

const wojtekMessage =
    document.getElementById("flashWojtekMessage");


/* =========================================
   WOJTEK IMAGES
   ========================================= */

const wojtekImages = {

    happy:
        "assets/wojtek/happy.png",

    wave:
        "assets/wojtek/waving.png",

    thinking:
        "assets/wojtek/thinking.png",

    studying:
        "assets/wojtek/studying.png",

    celebrate:
        "assets/wojtek/celebrate.png"

};


/* =========================================
   WOJTEK CONTROLLER
   ========================================= */

function flashWojtek(
    animation,
    message
) {

    /*
        Make sure the requested image exists.
    */

    const image =
        wojtekImages[animation] ||
        wojtekImages.happy;


    /*
        Change image.
    */

    wojtekElement.style.backgroundImage =
        `url("${image}")`;


    /*
        Restart the little transition animation.
    */

    wojtekElement.classList.remove(
        "change"
    );


    /*
        Force browser to restart animation.
    */

    void wojtekElement.offsetWidth;


    wojtekElement.classList.add(
        "change"
    );


    /*
        Change speech.
    */

    if (message) {

        wojtekMessage.innerHTML =
            message;

    }

}


/* =========================================
   SHOW CURRENT CARD
   ========================================= */

function show() {

    /*
        Put question on screen.
    */

    questionElement.textContent =
        list[i][0];


    /*
        Put answer in hidden answer box.
    */

    answerElement.textContent =
        list[i][1];


    /*
        Hide answer.
    */

    answerElement.classList.remove(
        "show"
    );


    /*
        Hide rating buttons.
    */

    ratingElement.classList.remove(
        "show"
    );


    /*
        Show reveal button.
    */

    revealButton.style.display =
        "inline-block";


    /*
        Update counter.
    */

    counterElement.textContent =
        `Card ${i + 1} of ${list.length}`;


    /*
        Update subject.
    */

    subjectElement.textContent =
        subject.charAt(0).toUpperCase() +
        subject.slice(1);


    /*
        Wojtek thinks about the question.
    */

    flashWojtek(

        "thinking",

        "<strong>Think carefully!</strong><br>" +
        "Take your time before revealing the answer."

    );

}


/* =========================================
   REVEAL ANSWER
   ========================================= */

function revealAnswer() {

    /*
        Show answer.
    */

    answerElement.classList.add(
        "show"
    );


    /*
        Show rating buttons.
    */

    ratingElement.classList.add(
        "show"
    );


    /*
        Hide reveal button.
    */

    revealButton.style.display =
        "none";


    /*
        Wojtek changes to studying.
    */

    flashWojtek(

        "studying",

        "<strong>Here's the answer!</strong><br>" +
        "How did you do?"

    );

}


/* =========================================
   RATE CARD
   ========================================= */

function rate(result) {

    /*
        Reward the student.

        Keep using GCSE Hub's existing
        award() system.
    */

    if (result === "easy") {

        award(
            10,
            2
        );

    } else {

        award(
            5,
            1
        );

    }


    /*
        Wojtek reacts to the rating.
    */

    if (result === "good") {

        flashWojtek(

            "happy",

            "<strong>Excellent! ⭐</strong><br>" +
            "You got it right!"

        );

    }


    else if (result === "easy") {

        flashWojtek(

            "happy",

            "<strong>Fantastic! 🌟</strong><br>" +
            "That one looked easy for you!"

        );

    }


    else if (result === "hard") {

        flashWojtek(

            "studying",

            "<strong>Nearly there!</strong><br>" +
            "Keep working on this one."

        );

    }


    else if (result === "again") {

        flashWojtek(

            "thinking",

            "<strong>That's okay!</strong><br>" +
            "We'll keep practising this one."

        );

    }


    /*
        Check whether this was the final card.
    */

    const finished =
        i === list.length - 1;


    if (finished) {

        /*
            Give the celebration a moment
            before moving back around.
        */

        flashWojtek(

            "celebrate",

            "<strong>Session complete! 🎉</strong><br>" +
            "Fantastic work — keep it up!"

        );

    }


    /*
        Move to next card.

        The modulo means the flashcard
        session can continue repeatedly.
    */

    i =
        (i + 1) %
        list.length;


    /*
        Give the celebration a moment
        before showing the next card.
    */

    if (finished) {

        setTimeout(

            show,

            1000

        );

    } else {

        show();

    }

}


/* =========================================
   BUTTON EVENTS
   ========================================= */

revealButton.addEventListener(

    "click",

    revealAnswer

);


document
    .getElementById("againBtn")
    .addEventListener(

        "click",

        () => rate("again")

    );


document
    .getElementById("hardBtn")
    .addEventListener(

        "click",

        () => rate("hard")

    );


document
    .getElementById("goodBtn")
    .addEventListener(

        "click",

        () => rate("good")

    );


document
    .getElementById("easyBtn")
    .addEventListener(

        "click",

        () => rate("easy")

    );


/* =========================================
   START FLASHCARD SESSION
   ========================================= */

show();

</script>

</body>

</html>
