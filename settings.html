<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings — GCSE Hub</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<script src="js/app.js"></script>

<script>
injectHeader();
</script>


<main class="main center">

    <div class="setup-title">

        <h1>
            Settings ⚙️
        </h1>

        <p>
            Manage your GCSE Hub profile.
        </p>

    </div>


    <div class="card">


        <h3>
            Profile
        </h3>


        <p>
            <strong>Name:</strong>
            <span data-name></span>
        </p>


        <p>
            <strong>Subject:</strong>
            <span data-subject></span>
        </p>


        <p>
            <strong>Level:</strong>
            <span id="level"></span>
        </p>


        <hr>


        <h3>
            Daily goal
        </h3>


        <p class="muted">
            Choose how many points you want
            to earn each day.
        </p>


        <div class="button-row">

            <button
                class="btn secondary"
                onclick="changeGoal(250)"
            >
                250
            </button>


            <button
                class="btn secondary"
                onclick="changeGoal(500)"
            >
                500
            </button>


            <button
                class="btn secondary"
                onclick="changeGoal(750)"
            >
                750
            </button>


            <button
                class="btn secondary"
                onclick="changeGoal(1000)"
            >
                1000
            </button>

        </div>


        <hr>


        <h3>
            Streak Freezes
        </h3>


        <p>

            🧊

            <strong id="freezes">
                0
            </strong>

            streak freezes

        </p>


        <button
            class="btn gold"
            onclick="buyFreeze()"
        >

            Buy freeze — 100 💎

        </button>


        <hr>


        <h3>
            Subject
        </h3>


        <a
            href="setup-subject.html"
            class="btn secondary"
        >
            Change subject
        </a>


        <hr>


        <h3>
            Danger Zone
        </h3>


        <button
            class="btn ghost"
            onclick="resetData()"
        >

            Reset GCSE Hub data

        </button>

    </div>


    <div style="margin-top:18px">

        <a
            href="dashboard.html"
            class="btn ghost"
        >
            ← Dashboard
        </a>

    </div>

</main>


<script>

let data = load();


document.getElementById("level")
    .textContent = data.level;


document.getElementById("freezes")
    .textContent =
    data.streakFreezes;


function changeGoal(goal) {

    const data = load();

    data.dailyGoal = goal;

    save(data);

    renderStats();

    alert(
        `Daily goal changed to ${goal} points.`
    );

}


function buyFreeze() {

    const data = load();


    if (data.gems < 100) {

        alert(
            "You need 100 gems to buy a streak freeze."
        );

        return;
    }


    data.gems -= 100;

    data.streakFreezes++;


    save(data);

    renderStats();


    document.getElementById("freezes")
        .textContent =
        data.streakFreezes;


    alert(
        "Streak Freeze added! 🧊"
    );

}

</script>

</body>
</html>
