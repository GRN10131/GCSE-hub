<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Name — GCSE Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<main class="main">


    <div class="setup-title">

        <h1>
            Welcome to GCSE Hub! 👋
        </h1>

        <p>
            First, what should we call you?
        </p>

    </div>


    <div class="card setup-card">


        <label for="name">

            Your name

        </label>


        <input

            id="name"

            type="text"

            placeholder="e.g. Grzegorz"

            maxlength="30"

            autocomplete="name"

        >


        <button
            id="continueButton"
            class="btn"
            style="margin-top:20px"
        >

            Continue →

        </button>


        <p
            id="error"
            class="error"
            style="display:none"
        >

            Please enter your name.

        </p>


    </div>


</main>


<script src="js/app.js"></script>


<script>


const input =
    document.getElementById(
        "name"
    );


const button =
    document.getElementById(
        "continueButton"
    );


const error =
    document.getElementById(
        "error"
    );


/*
   If a name already exists,
   show it.
*/

const data = load();

if (data.name) {

    input.value =
        data.name;

}


/* =========================================================
   SAVE NAME
   ========================================================= */

function continueSetup() {

    const name =
        input.value.trim();


    if (!name) {

        error.style.display =
            "block";

        input.focus();

        return;

    }


    const data =
        load();


    data.name =
        name;


    save(data);


    window.location.href =
        "setup-subject.html";

}


button.addEventListener(
    "click",
    continueSetup
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            continueSetup();

        }

    }
);

</script>


</body>

</html>
