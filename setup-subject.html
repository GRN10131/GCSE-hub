<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Subjects — GCSE Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .selection-count {

            text-align:center;

            margin-bottom:20px;

            font-weight:800;

        }


        .option-grid {

            display:grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap:14px;

        }


        .subject-option {

            position:relative;

            min-height:140px;

            cursor:pointer;

        }


        .subject-option.selected {

            border-color:#5b5ce2;

            background:#f3f3ff;

        }


        .check {

            position:absolute;

            top:12px;

            right:12px;

            width:25px;

            height:25px;

            border-radius:50%;

            border:2px solid #ddd;

            display:flex;

            align-items:center;

            justify-content:center;

        }


        .subject-option.selected
        .check {

            background:#5b5ce2;

            border-color:#5b5ce2;

            color:white;

        }


        .subject-option.selected
        .check::after {

            content:"✓";

        }


        .subject-icon {

            font-size:35px;

            display:block;

            margin-bottom:8px;

        }


        .subject-board {

            display:block;

            margin-top:5px;

            color:#777;

            font-size:12px;

        }

    </style>

</head>


<body>


<main class="main">


    <div class="setup-title">

        <h1>
            What subjects do you study?
        </h1>

        <p>
            Select every GCSE subject you study.
        </p>

    </div>


    <div
        id="count"
        class="selection-count"
    >

        0 subjects selected

    </div>


    <div
        id="subjects"
        class="option-grid"
    ></div>


    <div class="footer-actions">

        <a
            href="setup-name.html"
            class="btn ghost"
        >
            ← Back
        </a>


        <button
            id="continue"
            class="btn"
            disabled
        >

            Continue →

        </button>

    </div>


</main>


<script src="js/app.js"></script>


<script>


const data =
    load();


let selected =
    Array.isArray(data.subjects)
        ? [...data.subjects]
        : [];


const container =
    document.getElementById(
        "subjects"
    );


/* =========================================================
   BUILD SUBJECTS
   ========================================================= */

Object.entries(
    SUBJECTS
).forEach(
    ([id, subject]) => {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "card option subject-option";


        if (
            selected.includes(id)
        ) {

            button.classList.add(
                "selected"
            );

        }


        button.innerHTML = `

            <span class="check"></span>

            <span class="subject-icon">
                ${subject.icon}
            </span>

            <strong>
                ${subject.name}
            </strong>

            <span class="subject-board">
                ${subject.boards.join(" • ")}
            </span>

        `;


        button.addEventListener(
            "click",
            () => {

                if (
                    selected.includes(id)
                ) {

                    selected =
                        selected.filter(
                            item =>
                                item !== id
                        );

                    button.classList.remove(
                        "selected"
                    );

                } else {

                    selected.push(id);

                    button.classList.add(
                        "selected"
                    );

                }


                update();

            }
        );


        container.appendChild(
            button
        );

    }
);


/* =========================================================
   UPDATE
   ========================================================= */

function update() {

    const number =
        selected.length;


    document.getElementById(
        "count"
    ).textContent =

        number === 1

            ? "1 subject selected"

            : `${number} subjects selected`;


    document.getElementById(
        "continue"
    ).disabled =
        number === 0;

}


update();


/* =========================================================
   CONTINUE
   ========================================================= */

document
    .getElementById("continue")
    .addEventListener(
        "click",
        () => {

            if (
                selected.length === 0
            ) {

                return;

            }


            const data =
                load();


            data.subjects =
                [...selected];


            /*
               Keep the current subject
               if it is still selected.
            */

            if (
                !data.currentSubject ||
                !selected.includes(
                    data.currentSubject
                )
            ) {

                data.currentSubject =
                    selected[0];

            }


            save(data);


            window.location.href =
                "setup-details.html";

        }
    );

</script>


</body>

</html>
