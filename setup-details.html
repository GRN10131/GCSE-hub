<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subject Settings — GCSE Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .subject-config {

            margin-bottom:20px;

        }


        .config-header {

            display:flex;

            align-items:center;

            gap:12px;

            margin-bottom:20px;

        }


        .config-icon {

            font-size:35px;

        }


        .config-title {

            margin:0;

        }


        .config-subtitle {

            margin:4px 0 0;

            color:#777;

            font-size:14px;

        }


        .config-group {

            margin-top:18px;

        }


        .config-group label {

            display:block;

            font-weight:800;

            margin-bottom:8px;

        }


        .choice-row {

            display:flex;

            flex-wrap:wrap;

            gap:10px;

        }


        .choice {

            flex:1;

            min-width:120px;

            padding:13px;

            border:2px solid #e2e4eb;

            border-radius:12px;

            background:white;

            cursor:pointer;

            font-weight:700;

        }


        .choice.selected {

            border-color:#5b5ce2;

            background:#f3f3ff;

            color:#5b5ce2;

        }


        .no-level {

            padding:12px;

            background:#f6f7fa;

            border-radius:12px;

            color:#777;

            font-size:14px;

        }

    </style>

</head>


<body>


<main class="main">


    <div class="setup-title">

        <h1>
            Configure your subjects
        </h1>

        <p>
            Choose the exam board you use for each subject.
            For subjects with tiers, choose your level too.
        </p>

    </div>


    <div
        id="configs"
    ></div>


    <div class="footer-actions">

        <a
            href="setup-subject.html"
            class="btn ghost"
        >

            ← Back

        </a>


        <button
            id="finish"
            class="btn"
        >

            Finish setup 🚀

        </button>

    </div>


</main>


<script src="js/app.js"></script>


<script>


const data =
    load();


const container =
    document.getElementById(
        "configs"
    );


/* =========================================================
   CREATE CONFIGURATION CARD
   ========================================================= */

data.subjects.forEach(
    id => {

        const subject =
            SUBJECTS[id];


        if (!subject) {
            return;
        }


        /*
           Default board.
        */

        if (
            !data.boards[id]
        ) {

            data.boards[id] =
                subject.boards[0];

        }


        /*
           Default level.
        */

        if (
            subject.levels.length > 0 &&
            !data.levels[id]
        ) {

            data.levels[id] =
                subject.levels[
                    subject.levels.length - 1
                ];

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card subject-config";


        card.innerHTML = `

            <div class="config-header">

                <span class="config-icon">
                    ${subject.icon}
                </span>

                <div>

                    <h2 class="config-title">
                        ${subject.name}
                    </h2>

                    <p class="config-subtitle">
                        Choose your qualification settings
                    </p>

                </div>

            </div>


            <div class="config-group">

                <label>
                    Exam board
                </label>


                <div
                    class="choice-row"
                    data-board-row
                >

                    ${subject.boards.map(
                        board => `

                            <button

                                type="button"

                                class="
                                    choice
                                    board-choice
                                    ${
                                        data.boards[id] === board
                                            ? "selected"
                                            : ""
                                    }
                                "

                                data-board="${board}"
                            >

                                ${board}

                            </button>

                        `
                    ).join("")}

                </div>

            </div>


            ${
                subject.levels.length > 0

                ? `

                    <div class="config-group">

                        <label>
                            Level
                        </label>


                        <div
                            class="choice-row"
                            data-level-row
                        >

                            ${subject.levels.map(
                                level => `

                                    <button

                                        type="button"

                                        class="
                                            choice
                                            level-choice
                                            ${
                                                data.levels[id] === level
                                                    ? "selected"
                                                    : ""
                                            }
                                        "

                                        data-level="${level}"
                                    >

                                        ${level}

                                    </button>

                                `
                            ).join("")}

                        </div>

                    </div>

                `

                : `

                    <div class="config-group">

                        <label>
                            Level
                        </label>

                        <div class="no-level">

                            This subject does not use a
                            Foundation/Higher tier.

                        </div>

                    </div>

                `

            }

        `;


        container.appendChild(
            card
        );


        /* -----------------------------------------
           BOARD BUTTONS
           ----------------------------------------- */

        card
            .querySelectorAll(
                ".board-choice"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const board =
                                button.dataset.board;


                            data.boards[id] =
                                board;


                            card
                                .querySelectorAll(
                                    ".board-choice"
                                )
                                .forEach(
                                    other => {

                                        other.classList
                                            .remove(
                                                "selected"
                                            );

                                    }
                                );


                            button.classList.add(
                                "selected"
                            );

                        }
                    );

                }
            );


        /* -----------------------------------------
           LEVEL BUTTONS
           ----------------------------------------- */

        card
            .querySelectorAll(
                ".level-choice"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const level =
                                button.dataset.level;


                            data.levels[id] =
                                level;


                            card
                                .querySelectorAll(
                                    ".level-choice"
                                )
                                .forEach(
                                    other => {

                                        other.classList
                                            .remove(
                                                "selected"
                                            );

                                    }
                                );


                            button.classList.add(
                                "selected"
                            );

                        }
                    );

                }
            );

    }
);


/* =========================================================
   FINISH
   ========================================================= */

document
    .getElementById("finish")
    .addEventListener(
        "click",
        () => {

            /*
               Make absolutely sure every
               subject has a board.
            */

            for (
                const id of data.subjects
            ) {

                const subject =
                    SUBJECTS[id];


                if (
                    !data.boards[id]
                ) {

                    alert(
                        `Please choose an exam board for ${subject.name}.`
                    );

                    return;

                }


                if (
                    subject.levels.length > 0 &&
                    !data.levels[id]
                ) {

                    alert(
                        `Please choose a level for ${subject.name}.`
                    );

                    return;

                }

            }


            /*
               Initialise daily progress.
            */

            if (
                !data.pointsTodayDate
            ) {

                data.pointsTodayDate =
                    getToday();

            }


            save(data);


            window.location.href =
                "dashboard.html";

        }
    );

</script>


</body>

</html>
